# Kamal 2 deploy config for OpenCondo -> https://condo.juliana.dev/
# Docs: https://kamal-deploy.org
#
# Secrets live in .kamal/secrets (gitignored, see .kamal/secrets.example).
#   kamal setup   # first time: boots proxy + accessories + app
#   kamal deploy  # subsequent deploys

service: open-condo
image: juuh42dias/open-condo

servers:
  web:
    hosts:
      - 31.220.87.82

# Persist Active Storage uploads across deploys
volumes:
  - "open_condo_storage:/rails/storage"

proxy:
  ssl:
    certificate_pem: CONDO_CERT_PEM
    private_key_pem: CONDO_KEY_PEM
  host: condo.juliana.dev
  app_port: 3000
  forward_headers: true
  healthcheck:
    path: /_health
    interval: 3
    timeout: 2

registry:
  username: juuh42dias
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  secret:
    - RAILS_MASTER_KEY
    - OPEN_CONDO_DATABASE_PASSWORD
  clear:
    PGHOST: open-condo-db
    REDIS_URL: redis://open-condo-redis:6379/1

accessories:
  db:
    image: postgres:16
    host: 31.220.87.82
    port: 5432
    env:
      clear:
        POSTGRES_USER: open_condo
        POSTGRES_DB: open_condo_production
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - "open_condo_db_data:/var/lib/postgresql/data"

  redis:
    image: redis:7.0
    host: 31.220.87.82
    port: 6379
    volumes:
      - "open_condo_redis_data:/data"

# SSH as non-root user
ssh:
  user: kamal
